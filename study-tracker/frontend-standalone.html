<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;
  --border:#2a2a38;--border2:#3d3d55;
  --text:#e8e8f0;--muted:#6b6b85;--dim:#9090a8;
  --accent:#7c6af7;--accentH:#9585ff;--adim:rgba(124,106,247,0.15);
  --green:#3ddc84;--red:#ff5c5c;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:8px;--rl:14px;
}
html,body{min-height:100vh}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--sans)}
input,textarea{font-family:var(--sans)}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
nav{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:27px;height:27px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.05em}
.logo-text b{color:var(--accent);font-weight:700}
#nav-back{margin-left:auto;font-size:12px;color:var(--muted);cursor:pointer;padding:5px 12px;border:1px solid var(--border);border-radius:var(--r);display:none}
#nav-back:hover{color:var(--text);border-color:var(--border2)}
.page{max-width:1060px;margin:0 auto;padding:36px 22px;animation:fadeIn .2s ease}
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:36px}
h1{font-size:26px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;background:var(--accent);border:none;border-radius:var(--r);color:#fff;font-size:13px;font-weight:500;transition:background .15s;cursor:pointer}
.btn:hover{background:var(--accentH)}
.btn:disabled{background:var(--border);cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--dim);border-radius:var(--r);padding:8px 14px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-cancel{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:32px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 22px}
.stat-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:7px}
.stat-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:22px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,transform .15s,box-shadow .2s}
.card:hover{transform:translateY(-2px)}
.card-strip{position:absolute;top:0;left:0;right:0;height:3px}
.card-name{font-size:15px;font-weight:600;margin:6px 0 4px}
.card-desc{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.45}
.card-foot{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.pbar{display:flex;align-items:center;gap:10px}
.pbar-track{flex:1;height:5px;background:var(--border2);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.pbar-pct{font-family:var(--mono);font-size:10px;color:var(--dim);min-width:30px;text-align:right}
.empty{text-align:center;padding:70px 22px;border:2px dashed var(--border);border-radius:var(--rl)}
.empty-icon{font-size:38px;margin-bottom:14px}
.empty-title{font-size:18px;font-weight:600;margin-bottom:7px}
.empty-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.subject-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
.subject-prog-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{padding:7px 16px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid transparent;color:var(--muted);background:transparent;transition:all .15s}
.tab.on{background:var(--bg3);border-color:var(--border2);color:var(--text)}
.lec-list{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.lec-row{display:flex;align-items:center;gap:13px;padding:11px 15px;border-bottom:1px solid var(--border);transition:background .15s}
.lec-row:last-child{border-bottom:none}
.lec-row.done{background:rgba(61,220,132,0.04)}
.chk{width:19px;height:19px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.chk.on{background:var(--green);border-color:var(--green)}
.lec-title-text{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lec-title-text.done{color:var(--muted);text-decoration:line-through}
.lec-date{font-size:10px;color:var(--muted);font-family:var(--mono)}
.lec-num{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:26px;text-align:right}
.yt-link{color:var(--muted);font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:5px;text-decoration:none;flex-shrink:0;transition:all .15s}
.yt-link:hover{color:#ff4444;border-color:#ff444450}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:22px}
.chart-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.chart-big{font-family:var(--mono);font-size:28px;font-weight:700}
.chart-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px}
.eta-box{background:var(--adim);border:1px solid rgba(124,106,247,.28);border-radius:var(--r);padding:9px 14px;text-align:right}
.eta-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:2px}
.eta-val{font-size:13px;font-weight:500;color:var(--accent)}
.no-data{padding:44px 22px;text-align:center;color:var(--muted);font-size:13px;border:1px solid var(--border);border-radius:var(--rl)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:30px;width:100%;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.modal h2{font-size:17px;font-weight:600;margin-bottom:20px}
.field{margin-bottom:15px}
.field-lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;font-family:var(--mono)}
.inp{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.result-box{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.22);border-radius:var(--r);padding:14px;margin-bottom:20px}
.result-title{font-weight:600;color:var(--green);font-size:13px;margin-bottom:8px}
.result-row{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:3px}
.err-box{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.25);border-radius:var(--r);padding:10px 13px;font-size:12px;color:var(--red);margin-top:12px}
.spinner-el{animation:spin .8s linear infinite;display:inline-block}
.conn-err{padding:22px;background:rgba(255,92,92,.07);border:1px solid rgba(255,92,92,.22);border-radius:var(--rl);color:var(--red);font-size:13px;line-height:1.8}
</style>
</head>
<body>
<nav>
  <div class="logo" onclick="goHome()">
    <div class="logo-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
        <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
      </svg>
    </div>
    <span class="logo-text">STUDY<b>TRACK</b></span>
  </div>
  <span id="nav-back" onclick="goHome()">← Dashboard</span>
</nav>
<div id="app"></div>
<script>
const API = 'http://localhost:8000';
const COLORS = ['#7c6af7','#3ddc84','#f5c542','#ff6b6b','#60b4ff','#ff9f40'];
const S = {
  page:'dashboard', subject:null, subjectColor:'',
  subjects:[], lectures:[], progress:null, plan:null, planStatus:null, activeTab:'lectures',
  loadingSubjects:true, loadingLectures:false, loadingPlan:false,
  subjectError:null, lectureError:null, pending:new Set(),
  hoursInput: 2, generatingPlan: false
};
function set(patch){Object.assign(S,patch);render();}
async function req(method,path,body){
  const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||('HTTP '+r.status));}
  return r.json();
}
async function loadSubjects(){
  set({loadingSubjects:true,subjectError:null});
  try{const subjects=await req('GET','/subjects');set({subjects,loadingSubjects:false});}
  catch(e){set({loadingSubjects:false,subjectError:e.message});}
}
async function loadLectures(id){
  set({loadingLectures:true,lectureError:null,lectures:[]});
  try{const lectures=await req('GET','/lectures/'+id);set({lectures,loadingLectures:false});}
  catch(e){set({loadingLectures:false,lectureError:e.message});}
}
async function loadProgress(id){
  try{const progress=await req('GET','/progress/'+id);set({progress});}catch(e){}
}
async function loadPlan(id){
  set({loadingPlan:true});
  try{
    const plan=await req('GET','/plan/'+id);
    const planStatus=await req('GET','/plan/status/'+id);
    set({plan,planStatus,loadingPlan:false});
  }catch(e){
    set({plan:null,planStatus:null,loadingPlan:false});
  }
}
async function doGeneratePlan(){
  if(!S.subject)return;
  set({generatingPlan:true});
  try{
    await req('POST','/plan/generate/'+S.subject.id,{hours_per_day:S.hoursInput});
    await loadPlan(S.subject.id);
  }catch(e){
    alert('Failed to generate plan: '+e.message);
  }finally{
    set({generatingPlan:false});
  }
}
async function doAdjustPlan(){
  if(!S.subject)return;
  set({generatingPlan:true});
  try{
    await req('POST','/plan/adjust/'+S.subject.id);
    await loadPlan(S.subject.id);
  }catch(e){
    alert('Failed to adjust plan: '+e.message);
  }finally{
    set({generatingPlan:false});
  }
}
function formatDuration(sec){
  if(!sec)return'0m';
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}
function goHome(){
  document.getElementById('nav-back').style.display='none';
  set({page:'dashboard',subject:null,lectures:[],progress:null,plan:null,planStatus:null,activeTab:'lectures'});
  loadSubjects();
}
function goSubject(subjectId){
  const subject=S.subjects.find(s=>s.id===subjectId);
  if(!subject)return;
  const color=COLORS[S.subjects.indexOf(subject)%COLORS.length];
  document.getElementById('nav-back').style.display='block';
  set({page:'subject',subject,subjectColor:color,lectures:[],progress:null,plan:null,planStatus:null,activeTab:'lectures'});
  loadLectures(subject.id);
  loadProgress(subject.id);
  loadPlan(subject.id);
}
async function toggleLecture(id,completed){
  const pending=new Set(S.pending);pending.add(id);
  set({lectures:S.lectures.map(l=>l.id===id?{...l,completed}:l),pending});
  try{
    const updated=await req('PUT','/lectures/complete/'+id,{completed});
    const p2=new Set(S.pending);p2.delete(id);
    set({lectures:S.lectures.map(l=>l.id===id?updated:l),pending:p2});
    loadProgress(S.subject.id);loadSubjects();
  }catch(e){
    const p2=new Set(S.pending);p2.delete(id);
    set({lectures:S.lectures.map(l=>l.id===id?{...l,completed:!completed}:l),pending:p2});
    alert('Failed: '+e.message);
  }
}
async function doEditSubject(id, oldName) {
  const newName = prompt("Edit subject name:", oldName);
  if (newName && newName.trim() !== oldName) {
    try {
      const updated = await req('PUT', '/subjects/' + id, { name: newName.trim(), description: null });
      S.subjects = S.subjects.map(s => s.id === id ? updated : s);
      if (S.subject && S.subject.id === id) S.subject = updated;
      render();
    } catch(e) { alert(e.message); }
  }
}
async function doDeleteSubject(id) {
  if (confirm("Delete this subject and all its lectures?")) {
    try {
      await req('DELETE', '/subjects/' + id);
      S.subjects = S.subjects.filter(s => s.id !== id);
      if (S.subject && S.subject.id === id) goHome();
      else render();
    } catch(e) { alert(e.message); }
  }
}
async function doEditLecture(id, oldTitle) {
  const newTitle = prompt("Edit lecture title:", oldTitle);
  if (newTitle && newTitle.trim() !== oldTitle) {
    try {
      const updated = await req('PUT', '/lectures/' + id, { title: newTitle.trim() });
      set({ lectures: S.lectures.map(l => l.id === id ? updated : l) });
    } catch(e) { alert(e.message); }
  }
}
async function doDeleteLecture(id) {
  if (confirm("Delete this lecture?")) {
    try {
      await req('DELETE', '/lectures/' + id);
      set({ lectures: S.lectures.filter(l => l.id !== id) });
      loadProgress(S.subject.id); loadSubjects();
    } catch(e) { alert(e.message); }
  }
}
async function doClearLectures(subjectId) {
  if (confirm("Clear ALL lectures in this subject?")) {
    try {
      await req('DELETE', '/lectures/subject/' + subjectId);
      set({ lectures: [] });
      loadProgress(subjectId); loadSubjects();
    } catch(e) { alert(e.message); }
  }
}
function switchTab(tab){
  set({activeTab:tab});
  if(tab==='progress'&&S.subject)setTimeout(drawChart,60);
}
function openCreateModal(){
  const el=document.createElement('div');
  el.className='overlay';el.id='modal-create';
  el.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <h2>New Subject</h2>
    <div class="field"><label class="field-lbl">NAME *</label>
    <input class="inp" id="inp-sname" placeholder="e.g. Data Structures &amp; Algorithms"/></div>
    <div class="field"><label class="field-lbl">DESCRIPTION</label>
    <textarea class="inp" id="inp-sdesc" style="resize:vertical;min-height:75px" placeholder="Optional description..."></textarea></div>
    <div id="create-err"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal('create')">Cancel</button>
      <button class="btn" id="btn-do-create">Create Subject</button>
    </div></div>`;
  el.addEventListener('click',function(e){if(e.target===this)closeModal('create');});
  document.body.appendChild(el);
  setTimeout(()=>{
    const inp=document.getElementById('inp-sname');if(inp)inp.focus();
    const btn=document.getElementById('btn-do-create');if(btn)btn.addEventListener('click',doCreate);
  },30);
}
async function doCreate(){
  const name=(document.getElementById('inp-sname').value||'').trim();if(!name)return;
  const desc=(document.getElementById('inp-sdesc').value||'').trim();
  const btn=document.getElementById('btn-do-create');
  btn.disabled=true;btn.textContent='Creating…';
  try{
    const created=await req('POST','/subjects',{name,description:desc||null});
    S.subjects=[created,...S.subjects];closeModal('create');render();
  }catch(e){
    document.getElementById('create-err').innerHTML=`<div class="err-box">${e.message}</div>`;
    btn.disabled=false;btn.textContent='Create Subject';
  }
}
function openImportModal(){
  const el=document.createElement('div');
  el.className='overlay';el.id='modal-import';
  el.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <h2>Import YouTube Playlist</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:18px">Paste a YouTube playlist URL. All videos will be imported as lectures in order.</p>
    <div id="import-form">
      <div class="field"><label class="field-lbl">PLAYLIST URL</label>
      <input class="inp" id="inp-purl" placeholder="https://www.youtube.com/playlist?list=PL..."/></div>
      <div id="import-err"></div>
      <div class="modal-foot">
        <button class="btn-cancel" onclick="closeModal('import')">Cancel</button>
        <button class="btn" id="btn-do-import">Import Playlist</button>
      </div>
    </div>
    <div id="import-success" style="display:none"></div>
  </div>`;
  el.addEventListener('click',function(e){if(e.target===this)closeModal('import');});
  document.body.appendChild(el);
  setTimeout(()=>{
    const inp=document.getElementById('inp-purl');if(inp)inp.focus();
    const btn=document.getElementById('btn-do-import');if(btn)btn.addEventListener('click',doImport);
  },30);
}
async function doImport(){
  const url=(document.getElementById('inp-purl').value||'').trim();if(!url)return;
  if(!url.includes('list=')){
    document.getElementById('import-err').innerHTML='<div class="err-box">URL must contain a playlist ID (list=...)</div>';return;
  }
  const btn=document.getElementById('btn-do-import');
  btn.disabled=true;btn.innerHTML='<span class="spinner-el">↻</span> Importing…';
  document.getElementById('import-err').innerHTML='';
  try{
    const result=await req('POST','/youtube/import',{subject_id:S.subject.id,playlist_url:url});
    document.getElementById('import-form').style.display='none';
    document.getElementById('import-success').style.display='block';
    document.getElementById('import-success').innerHTML=`
      <div class="result-box">
        <div class="result-title">✓ Import complete</div>
        <div class="result-row">Inserted: ${result.inserted}</div>
        <div class="result-row">Skipped (duplicates): ${result.skipped}</div>
        <div class="result-row">Total fetched: ${result.total_fetched}</div>
      </div>
      <button class="btn" id="btn-import-done" style="width:100%">Done</button>`;
    document.getElementById('btn-import-done').addEventListener('click',()=>{
      closeModal('import');loadLectures(S.subject.id);loadProgress(S.subject.id);
    });
  }catch(e){
    document.getElementById('import-err').innerHTML=`<div class="err-box">${e.message}</div>`;
    btn.disabled=false;btn.textContent='Import Playlist';
  }
}
function closeModal(id){const el=document.getElementById('modal-'+id);if(el)el.remove();}
function drawChart(){
  const canvas=document.getElementById('prog-canvas');
  if(!canvas||!S.progress||!S.progress.snapshots||S.progress.snapshots.length<2)return;
  const snapshots=S.progress.snapshots;const color=S.subjectColor||'#7c6af7';
  const ctx=canvas.getContext('2d');
  const W=canvas.parentElement.offsetWidth||600;const H=180;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const pad={t:10,b:30,l:42,r:10};
  const iW=W-pad.l-pad.r;const iH=H-pad.t-pad.b;
  const data=snapshots.map(s=>s.completion_percentage);const n=data.length;
  const xp=i=>pad.l+(i/(n-1))*iW;const yp=v=>pad.t+iH-(v/100)*iH;
  ctx.strokeStyle='#2a2a38';ctx.lineWidth=0.5;
  [0,25,50,75,100].forEach(v=>{
    ctx.beginPath();ctx.moveTo(pad.l,yp(v));ctx.lineTo(pad.l+iW,yp(v));
    ctx.setLineDash(v===0||v===100?[]:[3,3]);ctx.stroke();ctx.setLineDash([]);
  });
  ctx.fillStyle='#6b6b85';ctx.font='10px monospace';ctx.textAlign='right';
  [0,50,100].forEach(v=>ctx.fillText(v+'%',pad.l-5,yp(v)+4));
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+iH);
  grad.addColorStop(0,color+'55');grad.addColorStop(1,color+'00');
  ctx.beginPath();ctx.moveTo(xp(0),yp(data[0]));
  data.forEach((v,i)=>{if(i>0)ctx.lineTo(xp(i),yp(v));});
  ctx.lineTo(xp(n-1),pad.t+iH);ctx.lineTo(xp(0),pad.t+iH);
  ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(xp(0),yp(data[0]));
  data.forEach((v,i)=>{if(i>0)ctx.lineTo(xp(i),yp(v));});
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  data.forEach((v,i)=>{ctx.beginPath();ctx.arc(xp(i),yp(v),3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();});
  ctx.fillStyle='#6b6b85';ctx.font='10px monospace';ctx.textAlign='center';
  [0,Math.floor(n/2),n-1].forEach(i=>{
    const d=new Date(snapshots[i].snapshot_date);
    ctx.fillText(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),xp(i),H-8);
  });
}
function mkSpinner(size=22){
  return `<svg class="spinner-el" width="${size}" height="${size}" viewBox="0 0 24 24" style="animation:spin .8s linear infinite;display:block">
    <circle cx="12" cy="12" r="10" fill="none" stroke="var(--border)" stroke-width="2.5"/>
    <path d="M12 2 A10 10 0 0 1 22 12" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}
function mkPbar(p,color){
  const c=p>=100?'var(--green)':(color||'var(--accent)');
  return `<div class="pbar"><div class="pbar-track"><div class="pbar-fill" style="width:${Math.min(p,100)}%;background:${c}"></div></div><span class="pbar-pct">${Math.round(p)}%</span></div>`;
}
function calcPct(lectures){if(!lectures.length)return 0;return Math.round(lectures.filter(l=>l.completed).length/lectures.length*100);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function render(){
  document.getElementById('app').innerHTML=S.page==='dashboard'?renderDashboard():renderSubjectPage();
  if(S.page==='subject'&&S.activeTab==='progress')setTimeout(drawChart,60);
}
function renderDashboard(){
  const{subjects,loadingSubjects,subjectError}=S;
  const total=subjects.reduce((a,s)=>a+(s.total_lectures||0),0);
  const done=subjects.reduce((a,s)=>a+(s.completed_lectures||0),0);
  let body='';
  if(loadingSubjects){body=`<div style="display:flex;justify-content:center;padding:80px">${mkSpinner(36)}</div>`;}
  else if(subjectError){body=`<div class="conn-err">❌ <strong>Cannot connect to backend.</strong><br><br>Make sure uvicorn is running:<br><code style="font-size:11px;background:var(--bg3);padding:2px 7px;border-radius:4px;font-family:var(--mono)">uvicorn app.main:app --reload --port 8000</code><br><br>Error: ${subjectError}</div>`;}
  else if(!subjects.length){body=`<div class="empty"><div class="empty-icon">📚</div><div class="empty-title">No subjects yet</div><div class="empty-sub">Create your first subject and import a YouTube playlist</div><button class="btn" onclick="openCreateModal()">Create Subject</button></div>`;}
  else{body=`<div class="cards">${subjects.map((s,i)=>{
    const color=COLORS[i%COLORS.length];const p=s.completion_percentage||0;
    const escapedName = s.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
    return `<div class="card" data-sid="${s.id}"
      onmouseenter="this.style.borderColor='${color}60';this.style.boxShadow='0 6px 28px ${color}12'"
      onmouseleave="this.style.borderColor='var(--border)';this.style.boxShadow='none'">
      <div class="card-strip" style="background:${color}"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="card-name">${esc(s.name)}</div>
        <div style="display:flex;gap:4px;margin-top:6px">
          <button class="btn-ghost" style="padding:2px 5px;border:none" onclick="event.stopPropagation();doEditSubject(${s.id},'${escapedName}')" title="Edit Subject">✎</button>
          <button class="btn-ghost" style="padding:2px 5px;border:none" onclick="event.stopPropagation();doDeleteSubject(${s.id})" title="Delete Subject">✖</button>
        </div>
      </div>
      ${s.description?`<div class="card-desc">${esc(s.description)}</div>`:'<div style="height:8px"></div>'}
      ${mkPbar(p,color)}
      <div class="card-foot"><span>${s.completed_lectures}/${s.total_lectures} lectures</span>${p>=100?'<span style="color:var(--green)">✓ Complete</span>':''}</div>
    </div>`;}).join('')}</div>`;}
  const stats=subjects.length?`<div class="stats">
    <div class="stat"><div class="stat-lbl">TOTAL SUBJECTS</div><div class="stat-val">${subjects.length}</div></div>
    <div class="stat"><div class="stat-lbl">TOTAL LECTURES</div><div class="stat-val">${total}</div></div>
    <div class="stat"><div class="stat-lbl">COMPLETED</div><div class="stat-val">${done}</div></div>
  </div>`:'';
  return `<div class="page"><div class="page-hdr"><div><h1>Dashboard</h1><div class="subtitle">Track your learning progress across all subjects</div></div>
    <button class="btn" onclick="openCreateModal()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New Subject</button>
  </div>${stats}${body}</div>`;
}
function renderSubjectPage(){
  const{subject,subjectColor,lectures,loadingLectures,lectureError,progress,activeTab}=S;
  if(!subject)return'';
  const color=subjectColor||'var(--accent)';
  const p=calcPct(lectures);const done=lectures.filter(l=>l.completed).length;
  const tabs=`<div class="tabs">
    <div class="tab ${activeTab==='lectures'?'on':''}" onclick="switchTab('lectures')">Lectures${lectures.length?' ('+lectures.length+')':''}</div>
    <div class="tab ${activeTab==='plan'?'on':''}" onclick="switchTab('plan')">Study Plan</div>
    <div class="tab ${activeTab==='progress'?'on':''}" onclick="switchTab('progress')">Progress Chart</div>
  </div>`;
  let panel='';
  if(activeTab==='lectures'){
    if(loadingLectures){panel=`<div style="display:flex;justify-content:center;padding:48px">${mkSpinner(32)}</div>`;}
    else if(lectureError){panel=`<div class="conn-err">Error: ${lectureError}</div>`;}
    else if(!lectures.length){panel=`<div class="no-data">No lectures yet.<br>Click <strong>Import Playlist</strong> above to fetch videos from YouTube.</div>`;}
    else{
      panel=`<div class="lec-list">${lectures.map(lec=>{
        const isPending=S.pending.has(lec.id);
        const chkStyle=lec.completed?`background:${color};border-color:${color}`:'';
        const chkInner=isPending?mkSpinner(13):lec.completed?`<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:'';
        const escapedTitle = lec.title.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        return `<div class="lec-row${lec.completed?' done':''}">
          <div class="chk${lec.completed?' on':''}" style="${chkStyle}" data-lid="${lec.id}" data-completed="${lec.completed}">${chkInner}</div>
          <div style="flex:1;min-width:0">
            <div class="lec-title-text${lec.completed?' done':''}">${esc(lec.title)}</div>
            ${lec.completed_at?`<div class="lec-date">completed ${fmtDate(lec.completed_at)}</div>`:''}
          </div>
          <div style="display:flex;gap:4px;opacity:0.7">
            <button class="btn-ghost" style="padding:3px 6px;border:none;min-width:0" onclick="event.stopPropagation();doEditLecture(${lec.id},'${escapedTitle}')" title="Edit Lecture">✎</button>
            <button class="btn-ghost" style="padding:3px 6px;border:none;min-width:0" onclick="event.stopPropagation();doDeleteLecture(${lec.id})" title="Delete Lecture">✖</button>
          </div>
          <span class="lec-num">#${lec.lecture_order+1}</span>
          <a class="yt-link" href="${lec.youtube_url}" target="_blank">▶ YT</a>
        </div>`;}).join('')}</div>`;
    }
  }else if(activeTab==='plan'){
    if(S.loadingPlan){panel=`<div style="display:flex;justify-content:center;padding:48px">${mkSpinner(32)}</div>`;}
    else if(!S.plan){
      panel=`<div class="no-data" style="text-align:center">
        <h3 style="margin-bottom:8px;color:var(--text);font-size:16px">No Study Plan Yet</h3>
        <p style="margin-bottom:16px;font-size:13px">Generate a smart study plan based on video durations to stay on track.</p>
        <div style="display:inline-flex;align-items:center;gap:8px">
          <label style="font-size:12px;color:var(--muted)">Hours per day:</label>
          <input type="number" step="0.5" min="0.5" value="${S.hoursInput}" onchange="set({hoursInput:parseFloat(this.value)})" style="width:60px;padding:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--r)"/>
          <button class="btn" onclick="doGeneratePlan()" ${S.generatingPlan?'disabled':''}>${S.generatingPlan?'Generating...':'Generate Plan'}</button>
        </div>
      </div>`;
    }else{
      const plan = S.plan;
      const status = S.planStatus;
      const daysPassed = Math.max(1, Math.floor((new Date() - new Date(plan.start_date)) / (1000 * 60 * 60 * 24)) + 1);
      const todaysPlan = plan.days.find(d => d.day_number === daysPassed);
      
      let statusBanner='';
      if(status){
        const isAhead = status.status === 'ahead';
        const isBehind = status.status === 'behind';
        const bg = isAhead ? 'rgba(46, 204, 113, 0.1)' : isBehind ? 'rgba(231, 76, 60, 0.1)' : 'var(--bg2)';
        const borderColor = isAhead ? 'rgba(46, 204, 113, 0.3)' : isBehind ? 'rgba(231, 76, 60, 0.3)' : 'var(--border)';
        const textColor = isAhead ? '#2ecc71' : isBehind ? '#e74c3c' : 'var(--accent)';
        const textMsg = isAhead ? '● You are ahead of schedule' : isBehind ? '● You are behind schedule' : '● You are on track';
        
        statusBanner=`<div style="display:flex;gap:16px;padding:16px;border-radius:var(--r);background:${bg};border:1px solid ${borderColor};margin-bottom:24px">
          <div style="flex:1">
            <h3 style="font-size:15px;font-weight:600;margin-bottom:6px;color:${textColor}">${textMsg}</h3>
            <p style="font-size:12px;color:var(--muted)">${status.status !== 'on_track' ? `Deviation: ${status.deviation_minutes} minutes. ` : ''}Average speed: ${status.avg_time_per_day_minutes} mins/day.</p>
            ${status.estimated_completion_date ? `<p style="font-size:12px;color:var(--muted);margin-top:4px">Estimated completion: <strong>${fmtDate(status.estimated_completion_date)}</strong></p>` : ''}
          </div>
          ${isBehind ? `<div style="display:flex;align-items:center"><button class="btn-ghost" style="color:#e74c3c;border-color:#e74c3c" onclick="doAdjustPlan()" ${S.generatingPlan?'disabled':''}>${S.generatingPlan?'Adjusting...':'Adjust Plan'}</button></div>` : ''}
        </div>`;
      }

      let todaysTasksHtml='';
      if(todaysPlan){
        todaysTasksHtml=`<h3 style="font-size:15px;font-weight:600;margin-bottom:12px">Today's Tasks (Day ${daysPassed})</h3>
        <div style="display:grid;gap:8px;margin-bottom:24px">
          ${todaysPlan.lecture_ids.map(lId => {
            const lec = lectures.find(l=>l.id===lId);
            if(!lec)return'';
            return `<div style="display:flex;align-items:center;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);opacity:${lec.completed?0.6:1}">
              <div style="flex:1;overflow:hidden"><div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:${lec.completed?'line-through':'none'}">${lec.lecture_order+1}. ${esc(lec.title)}</div></div>
              <div style="color:var(--muted);font-size:12px;margin-left:16px">${formatDuration(lec.duration)}</div>
            </div>`;
          }).join('')}
        </div>`;
      }

      const fullPlanHtml=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <h3 style="font-size:15px;font-weight:600">Full Plan Breakdown</h3>
          <button class="btn-ghost" style="padding:4px 8px;font-size:11px" onclick="doGeneratePlan()" ${S.generatingPlan?'disabled':''}>${S.generatingPlan?'Regenerating...':'Regenerate Plan'}</button>
        </div>
        <div style="display:grid;gap:12px">
          ${plan.days.map(day => `
            <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px">
              <div style="display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
                <strong style="font-size:13px">Day ${day.day_number}</strong>
                <span style="font-size:12px;color:var(--muted)">${formatDuration(day.total_duration)}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:5px">
                ${day.lecture_ids.map(lId => {
                  const lec = lectures.find(l=>l.id===lId);
                  if(!lec)return'';
                  return `<div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lec.completed?'✓ ':'○ '}${lec.lecture_order+1}. ${esc(lec.title)}</div>`;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>`;
      
      panel=`<div>${statusBanner}${todaysTasksHtml}${fullPlanHtml}</div>`;
    }
  }
  const escapedSubjectName = subject.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
  return `<div class="page" style="max-width:880px"><div class="subject-hdr"><div style="flex:1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <h1 style="margin-bottom:0">${esc(subject.name)}</h1>
      <button class="btn-ghost" style="padding:4px 8px;border:none" onclick="doEditSubject(${subject.id}, '${escapedSubjectName}')" title="Edit Subject">✎</button>
      <button class="btn-ghost" style="padding:4px 8px;border:none" onclick="doDeleteSubject(${subject.id})" title="Delete Subject">✖</button>
    </div>
    ${subject.description?`<div class="subtitle">${esc(subject.description)}</div>`:''}
    <div class="subject-prog-row">
      <div class="pbar-track" style="flex:1;max-width:300px;height:6px"><div class="pbar-fill" style="width:${p}%;background:${p>=100?'var(--green)':color}"></div></div>
      <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${done} / ${lectures.length} lectures</span>
    </div></div>
    <div style="display:flex;gap:8px">
      ${lectures.length ? `<button class="btn-ghost" style="border-color:var(--red);color:var(--red)" onclick="doClearLectures(${subject.id})">Clear Lectures</button>` : ''}
      <button class="btn-ghost" onclick="openImportModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.4a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58z"/>
          <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor"/>
        </svg>
        Import Playlist
      </button>
    </div>
  </div>${tabs}${panel}</div>`;
}
document.getElementById('app').addEventListener('click',function(e){
  const card=e.target.closest('.card[data-sid]');
  if(card){goSubject(parseInt(card.dataset.sid));return;}
  const chk=e.target.closest('.chk[data-lid]');
  if(chk){e.stopPropagation();const id=parseInt(chk.dataset.lid);const completed=chk.dataset.completed==='true';if(!S.pending.has(id))toggleLecture(id,!completed);return;}
  if(e.target.closest('.yt-link')){e.stopPropagation();return;}
});
render();
loadSubjects();
</script>
</body>
</html>
